services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: pairnotes
      POSTGRES_PASSWORD: pairnotes-local-only
      POSTGRES_DB: pairnotes_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairnotes -d pairnotes_test"]
      interval: 2s
      retries: 30
  minio:
    # Local test fixture only. This legacy image is not the production storage service.
    image: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    environment:
      MINIO_ROOT_USER: pairnotes-local
      MINIO_ROOT_PASSWORD: pairnotes-local-only
    ports: ["127.0.0.1:59000:9000"]
