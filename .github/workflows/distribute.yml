name: PairNotes signed archive

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the verified IPA to App Store Connect (processing checked separately)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pairnotes-signed-archive
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verified-ci:
    name: Require successful CI for this exact commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait up to 15 minutes for the matching push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/wait_for_ci.py

  archive:
    name: Export signed IPA and optionally upload to TestFlight
    needs: verified-ci
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Xcode and initialize installed runtimes
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun simctl list > /dev/null
      - name: Import signing assets, archive and export
        env:
          PAIRNOTES_DISTRIBUTION_P12_BASE64: ${{ secrets.PAIRNOTES_DISTRIBUTION_P12_BASE64 }}
          PAIRNOTES_DISTRIBUTION_P12_PASSWORD: ${{ secrets.PAIRNOTES_DISTRIBUTION_P12_PASSWORD }}
          PAIRNOTES_APP_PROFILE_BASE64: ${{ secrets.PAIRNOTES_APP_PROFILE_BASE64 }}
          PAIRNOTES_WIDGET_PROFILE_BASE64: ${{ secrets.PAIRNOTES_WIDGET_PROFILE_BASE64 }}
          PAIRNOTES_IOS_CONFIG: ${{ secrets.PAIRNOTES_IOS_CONFIG }}
        run: bash scripts/ci/distribute.sh build
      - name: Remove temporary signing assets and local configuration
        if: always()
        run: bash scripts/ci/distribute.sh cleanup
      - name: Save signed IPA and debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pairnotes-signed-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/distribution/PairNotes.ipa
            artifacts/distribution/PairNotes.dSYMs.tar.gz
            artifacts/distribution/build-info.txt
            artifacts/distribution/verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified IPA to App Store Connect
        if: inputs.upload_to_testflight
        timeout-minutes: 15
        env:
          PAIRNOTES_UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          PAIRNOTES_ASC_KEY_ID: ${{ secrets.PAIRNOTES_ASC_KEY_ID }}
          PAIRNOTES_ASC_ISSUER_ID: ${{ secrets.PAIRNOTES_ASC_ISSUER_ID }}
          PAIRNOTES_ASC_PRIVATE_KEY: ${{ secrets.PAIRNOTES_ASC_PRIVATE_KEY }}
        run: bash scripts/ci/upload_testflight.sh upload
      - name: Remove temporary App Store Connect key
        if: always()
        run: bash scripts/ci/upload_testflight.sh cleanup
      - name: Save upload outcome without credentials
        if: always() && inputs.upload_to_testflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pairnotes-upload-result-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/distribution/upload-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save archive and export logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pairnotes-distribution-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/distribution/*.log
          if-no-files-found: warn
          retention-days: 7
