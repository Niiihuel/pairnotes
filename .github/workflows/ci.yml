name: PairNotes visual diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: PaperKit paper color and layer frame diagnostic
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the paper color and layer frame test on iOS 26.2
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcrun simctl list > /dev/null
          bash scripts/ci/ios.sh test
      - name: Package build evidence, preserving file permissions
        if: always()
        run: |
          if [ -d artifacts ]; then
            tar -czf ios-evidence.tar.gz artifacts
          fi
      - name: Save logs, results, screenshots and simulator app
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-evidence-${{ github.run_attempt }}
          path: ios-evidence.tar.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Save small render evidence separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperkit-renders-${{ github.run_attempt }}
          path: artifacts/ios-tests/attachments/
          if-no-files-found: warn
          retention-days: 14
